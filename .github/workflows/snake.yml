name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"        # daily at midnight UTC
  workflow_dispatch:           # allow manual runs

permissions:
  contents: write              # allow pushing generated snake files

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@main
        id: snake
        with:
          github_user_name: drxzx7
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-light.svg?palette=github-light

      - name: Commit and push generated snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          file_pattern: dist/*.svg
          commit_message: "chore: update contribution snake"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
